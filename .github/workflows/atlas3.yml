name: atlas3

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Show IP info
        run: |
          curl ifconfig.io
          echo "runner:runner" | sudo chpasswd
          sudo systemctl start ssh

      - name: Download and setup Xray
        run: |
          sudo mkdir -p /var/log/v2ray
          sudo chmod 755 /var/log/v2ray
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/Xray.zip
          unzip /tmp/Xray.zip -d /tmp/xray-tmp
          sudo cp /tmp/xray-tmp/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          sudo mkdir -p /etc/xray
          curl -L https://github.com/pornnewbee/socks5-for-serv00/raw/refs/heads/main/Configs/V2Ray/config.json -o config.json
          sudo mv config.json /etc/xray/
          curl -L https://github.com/pornnewbee/socks5-for-serv00/raw/refs/heads/main/Configs/V2Ray/xray.service -o xray.service
          sudo mv xray.service /etc/systemd/system/
          sudo /usr/local/bin/xray -test -c /etc/xray/config.json

      - name: Start Xray service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable xray
          sudo systemctl start xray
          sudo systemctl status xray --no-pager

      - name: Install latest cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version
          sudo cloudflared service install eyJhIjoiYjhhMDViNzIyNTUzNGFiZTA1NTRiOTZhZTA2MGVmOTUiLCJ0IjoiNjMyNjU5YmItM2IxNy00Zjc3LTg4MDktYmM2ZmZlM2RiZTBjIiwicyI6Ik9XTXdOVGRpT0dRdFlqTmhOQzAwTmprekxUZ3laVFF0WkdRd05ETXhaV1V3TkRKbSJ9
          curl -L https://github.com/pornnewbee/codespace/raw/refs/heads/main/service/atlas1.service -o atlas.service
          sudo mv atlas.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable atlas
          sudo systemctl start atlas
          sudo rm -rf ~/tmp

      - name: Collect TG bot messages (2 min)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          sudo pip3 install requests
          cd ~
          # 下载收集器脚本（纯收集，不执行任何命令）
          curl -L https://raw.githubusercontent.com/gaylish/codespace/main/script/tgbot_collector.py -o tgbot_collector.py
          # 直接写 service 文件，避免 sed 问题
          sudo tee /etc/systemd/system/tgbot.service > /dev/null <<SVCEOF
          [Unit]
          Description=Telegram Bot Collector
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /home/runner/tgbot_collector.py
          WorkingDirectory=/home/runner
          Environment="BOT_TOKEN=${BOT_TOKEN}"
          Environment="COLLECTOR_LOG_FILE=/home/runner/tgbot_messages.jsonl"
          Environment="COLLECTOR_DURATION=120"

          Restart=no
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SVCEOF
          sudo systemctl daemon-reload
          sudo systemctl start tgbot
          echo "=== tgbot collector started, waiting 2 min ==="
          sleep 130
          echo "=== collector should be done, checking logs ==="
          sudo journalctl -u tgbot --no-pager --since "3 min ago" || true
          echo "=== message file ==="
          ls -la ~/tgbot_messages.jsonl || true
          wc -l ~/tgbot_messages.jsonl || true
          head -5 ~/tgbot_messages.jsonl || true
          sudo systemctl stop tgbot || true

      - name: Upload collector log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgbot-collector-log
          path: /home/runner/tgbot_messages.jsonl
          retention-days: 30
